[project]
name = "gdelt-experiments"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "torch==2.10.0",
    "torchvision==0.25.0",
    "torch-geometric==2.8.0.post1",
    "pyg-lib==0.7.0",
    "transformers==5.5.0",
    "numpy==2.3.5",
    "pandas==2.3.3",
    "scikit-learn==1.8.0",
    "scipy==1.16.3",
    "matplotlib==3.10.8",
    "seaborn==0.13.2",
    "pyarrow==23.0.1",
    "pyyaml==6.0.3",
    "tqdm==4.67.1",
    "networkx==3.6.1",
    "ipykernel==7.1.0",
    "pillow>=12.3.0",
    "idna>=3.15",
    "urllib3>=2.7.0",
]

[dependency-groups]
dev = ["pytest>=9.0.3", "pytest-cov"]

[tool.uv]
package = false
find-links = ["https://data.pyg.org/whl/torch-2.10.0+cu126.html"]
no-build-package = ["pyg-lib"]
constraint-dependencies = ["setuptools>=83.0.0"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: full-pipeline smoke test (multi-minute, needs GPU, writes real data/results artifacts); run explicitly with `pytest -m integration`",
]
addopts = "-m 'not integration'"
